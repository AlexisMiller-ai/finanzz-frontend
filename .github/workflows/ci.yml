name: CI

# Roda em todo PR e em todo push na main: lint, checagem de tipos + build de
# produção, e os testes dos leitores de extrato (CSV/OFX).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-e-testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
